; Vanetza-NAP Config - ZENOH transport (Autoware integracio)
; -----------------------------------------------------------------------------
; Zenoh-specifikus beallitasok [Z] jellel:
;   - minden uzenettipusnal: zenoh_enabled=true, mqtt_enabled=false, dds_enabled=false
;   - [general] zenoh_local_only=true -> a Zenoh router tcp/127.0.0.1:7447#iface=lo-n figyel
;   - a Zenoh kulcsok = a topic_in/topic_out stringek (pl. vanetza/in/cam)
;
; FONTOS:
;   * A socktap a /zenoh_config.json5-t FIXEN a gyokerbol tolti (/zenoh_config.json5).
;     Gyozodj meg rola hogy letezik ott (a Dockerfile odamasolja).
;   * Broker NEM kell: az MQTT kliens connect_async-os, broker nelkul is elindul.
;   * use_hardcoded_gps=true  -> nem var gpsd-re (kulonben "positioning error").
;   * Self-teszthez: interface=lo + ignore_own_messages=false + cam.periodicity=1000
;     -> a socktap maga general CAM-et, lo visszacsorgatja, sajat magat dekodolja.
;     Eles uzem: interface=br-198b9ca51aa0 (a vanetzalan0 bridge-ed), ignore_own=true,
;     cam.periodicity=0 (csak a Python node altal Zenoh-ra publikalt CAM megy ki).
; -----------------------------------------------------------------------------

[general]
interface=eth0                    ; self-teszt: lo ; eles: br-198b9ca51aa0
local_mqtt_broker=127.0.0.1
local_mqtt_port=1883
remote_mqtt_broker=""
remote_mqtt_port=0
remote_mqtt_username=""
remote_mqtt_password=""
gpsd_host=127.0.0.1
gpsd_port=2947
prometheus_port=9100
rssi_enabled=false              ; nincs valodi 802.11 -> ki
mcs_enabled=false
ignore_own_messages=false
ignore_rsu_messages=false
enable_json_prints=true
dds_domain_id=0
dds_participant_name=Vanetza
num_threads=-1
publish_encoded_payloads=false
debug_enabled=true
zenoh_local_only=true           ; [Z] egy hoston, loopback. Tobb host: false + zenoh_interfaces
zenoh_interfaces=""             ; [Z] zenoh_local_only=false eseten pl. "lo,eth0"

[station]
id=1
type=5                          ; 5 = passengerCar
mac_address=6e:06:e0:03:00:01
beacons_enabled=true
use_hardcoded_gps=true          ; nem var gpsd-re
latitude=47.5316
longitude=21.6273
length=4.9
width=1.9

[cam]
enabled=true
mqtt_enabled=false
dds_enabled=false               ; [Z]
zenoh_enabled=true
mqtt_time_enabled=false
mqtt_test_enabled=false
periodicity=0
topic_in=vanetza/in/cam         ; Zenoh kulcs is ez
topic_out=vanetza/out/cam
topic_time=vanetza/time/cam
udp_out_addr=127.0.0.1
udp_out_port=0
own_topic_out=vanetza/own/cam
topic_test=vanetza/test/cam

[denm]
enabled=true
mqtt_enabled=false
dds_enabled=false
zenoh_enabled=true
mqtt_time_enabled=true
mqtt_test_enabled=false
periodicity=0
topic_in=vanetza/in/denm
topic_out=vanetza/out/denm
topic_time=vanetza/time/denm
topic_test=vanetza/test/denm
udp_out_addr=127.0.0.1
udp_out_port=0

