[general]
; self-teszt: lo ; eles: br-198b9ca51aa0
interface=eth0
local_mqtt_broker=127.0.0.1
local_mqtt_port=1883
remote_mqtt_broker=""
remote_mqtt_port=0
remote_mqtt_username=""
remote_mqtt_password=""
gpsd_host=127.0.0.1
gpsd_port=2947
prometheus_port=9100
; nincs valodi 802.11 -> ki
rssi_enabled=false
mcs_enabled=false
ignore_own_messages=true
ignore_rsu_messages=false
enable_json_prints=true
dds_domain_id=0
dds_participant_name=Vanetza
num_threads=-1
publish_encoded_payloads=true
debug_enabled=true
; [Z] a socktap a Zenoh sessiont akkor is felepiti, ha egy alkalmazas sem
; hasznalja (nalunk mind zenoh_enabled=false). true = maradjon loopbackon.
zenoh_local_only=true
; [Z] zenoh_local_only=false eseten pl. "lo,eth0"
zenoh_interfaces=""

[station]
id=1
; 5 = passengerCar
type=5
mac_address=6e:06:e0:03:00:01
beacons_enabled=true
; nem var gpsd-re
use_hardcoded_gps=true
latitude=47.5316
longitude=21.6273
length=4.9
width=1.9

[cam]
enabled=true
mqtt_enabled=true
dds_enabled=false
zenoh_enabled=false
mqtt_time_enabled=false
mqtt_test_enabled=false
periodicity=0
; Zenoh kulcs is ez
