# CAM broadcaster parameterek
# Inditas:
#   sudo python3 autoware_cam_broadcaster.py --ros-args --params-file cam_params.yaml
#
# A /**: wildcard miatt a node nevetol fuggetlenul ervenyesul.
# YAML-ban nincs hex, ezert a byte-ertekek decimalisan: 0x1a=26, 0x02=2.

/**:
  ros__parameters:
    # --- ASN.1 (CAM rel1) - a konteneren beluli utak ---
    asn1_files:
      - "/home/aw/vanetza_src/asn1/EN302637-2v141-CAM.asn"
      - "/home/aw/vanetza_src/asn1/TS102894-2v131-CDD.asn"

    # --- halozat ---
    interface: "eth0"
    dst_mac: "ff:ff:ff:ff:ff:ff"   # GeoNetworking broadcast
    src_mac: ""                    # ures = automatikusan az eth0 MAC-ja

    # --- TF / koordinata ---
    map_frame: "map"
    vehicle_frame: "base_link"
    # local terkep -> nincs valos georeferencia; barmilyen nem-nulla origo jo (NE 0,0!)
    origin_latitude: 47.5301
    origin_longitude: 21.6243
    origin_altitude: 120.0

    # --- CAM / jarmu ---
    rate_hz: 10.0
    station_id: 12345              # allitsd egyedire, ha tobb adot futtatsz a buszon
    station_type: 5                # 5 = passengerCar
    vehicle_length_dm: 49          # 0.1 m egyseg (~4.9 m)
    vehicle_width_dm: 19           # 0.1 m egyseg (~1.9 m)

    # --- GeoNetworking ---
    gn_version: 1
    gn_lifetime_byte: 26           # 0x1a
    gn_traffic_class: 2            # CAM = TC 2
    timestamp_offset_ms: 0         # csak ha a vevo "too old/future"-kent dobja

    # --- konfidencia / irany ---
    position_confidence_cm: 100    # placeholder
    heading_confidence: 10         # placeholder
    speed_confidence: 10           # placeholder
    course_from: "velocity"        # 'velocity' vagy 'orientation'
    min_speed_for_course: 0.3
    speed_filter_alpha: 0.4

    log_debug: true
