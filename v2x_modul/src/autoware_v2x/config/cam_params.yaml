# Egyesitett CAM node parameterek (kuldes + fogadas egyben)
# Inditas:
#   sudo python3 cam_node.py --ros-args --params-file params.yaml
#
# A /**: wildcard miatt a node nevetol fuggetlenul ervenyesul.
# YAML-ban nincs hex, ezert a byte-ertekek decimalisan: 0x1a=26, 0x02=2.
#
# RViz: Add -> By topic -> PredictedObjects a /v2x/cam/objects temarol.

/**:
  ros__parameters:
    # ====================================================================
    # KOZOS (kuldes + fogadas)
    # ====================================================================
    interface: "enp5s0"

    # ASN.1 (CAM rel1) - a konteneren beluli utak
    asn1_files:
      - "/home/aw/vanetza_src/asn1/EN302637-2v141-CAM.asn"
      - "/home/aw/vanetza_src/asn1/TS102894-2v131-CDD.asn"

    # local terkep -> nincs valos georeferencia; barmilyen nem-nulla origo jo (NE 0,0!)
    # FONTOS: minden entitasnak UGYANAZ legyen, kulonben rossz helyre kerul az objektum!
    origin_latitude: 47.5301
    origin_longitude: 21.6243
    origin_altitude: 120.0

    log_debug: false

    # ====================================================================
    # KULDES (sajat jarmu TF -> CAM broadcast)
    # ====================================================================
    map_frame: "map"
    vehicle_frame: "base_link"

    dst_mac: "ff:ff:ff:ff:ff:ff"   # GeoNetworking broadcast
    src_mac: ""                    # ures = automatikusan az eth0 MAC-ja

    rate_hz: 30.0
    station_id: 12345              # FONTOS: kontenerenkent EGYEDI legyen!
                                   # ha 12345 marad es van AWID env (run_cont.sh),
                                   # a node automatikusan 10000+AWID-re allitja.
                                   # a node a sajat CAM-ot ez alapjan szuri ki:
                                   # ha ket konteneren UGYANAZ, nem latszanak az objektumok!
    station_type: 5                # 5 = passengerCar
    vehicle_length_dm: 49          # 0.1 m egyseg (~4.9 m)
    vehicle_width_dm: 19           # 0.1 m egyseg (~1.9 m)

    # --- GeoNetworking ---
    gn_version: 1
    gn_lifetime_byte: 26           # 0x1a
    gn_traffic_class: 2            # CAM = TC 2
    timestamp_offset_ms: 0         # csak ha a vevo "too old/future"-kent dobja

    # --- konfidencia / irany ---
    position_confidence_cm: 100    # placeholder
    heading_confidence: 10         # placeholder
    speed_confidence: 10           # placeholder
    course_from: "velocity"        # 'velocity' vagy 'orientation'
    min_speed_for_course: 0.3
    speed_filter_alpha: 0.4

    # ====================================================================
    # FOGADAS (mas CAM-ok -> PredictedObjects RViz-nek)
    # ====================================================================
    output_topic: "/v2x/cam/objects"   # RViz: ezt a topicot add hozza PredictedObjects-kent
    frame_id: "map"
    publish_rate_hz: 30.0
    object_timeout_s: 2.0          # ennyi ido utan eltunik, ha nem jon ujabb CAM
    object_height: 1.5             # m (a CAM-ben nincs magassag)
    predicted_path_horizon_s: 5.0
    predicted_path_dt_s: 0.5
